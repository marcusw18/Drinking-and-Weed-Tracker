version: '3.8'

services:
  vulture-server:
    build: .
    ports:
      - "8000:8080"
    environment:
      PORT: 8080
    restart: unless-stopped
    container_name: vulture-ml-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
